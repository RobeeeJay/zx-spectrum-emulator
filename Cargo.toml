[package]
name = "zx-rustrum"
version = "0.1.0"
edition = "2021"
default-run = "zx-rustrum"

[dependencies]
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    # wgpu rather than glow: on macOS the OpenGL path goes through glutin,
    # which panics ("context to have a current view") when a viewport's window
    # loses its view. wgpu uses Metal there and has no such path.
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.35"
rfd = "0.15"
cpal = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"

[dev-dependencies]
egui_kittest = "0.35"
